<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BLOODSITAX — Survivor Overlay (Chroma)</title>
<style>
/* ============================================================
   BLOODSITAX — Overlay Survivor + Perks para OBS
   Fondo verde croma (#00FF00) para Chroma Key
   ============================================================ */

* { margin:0; padding:0; box-sizing:border-box; }

:root{
  --pk:#FF2D9A; --pi:#FF007F; --md:#D4006A;
  --br:#8A003F; --dg:#48001F;
  --almost-black:#12000D; --dark-purple:#1A0010;
  --chroma:#00FF00;
}

html, body{
  width:100%;
  min-height:100vh;
  background:var(--chroma);           /* VERDE CROMA */
  font-family:'Poppins', sans-serif;
  overflow:hidden;
}

.overlay{
  width:100%;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:16px;
  padding:18px;
}

/* ===== FILA HORIZONTAL ===== */
.row{
  display:flex;
  flex-direction:row;
  align-items:center;
  justify-content:center;
  gap:14px;
}

/* ===== TÍTULO ÚNICO ===== */
.main-title{
  font-family:'Bebas Neue', sans-serif;
  font-size:1.5rem;
  letter-spacing:.26em;
  text-align:center;
  color:#fff;
  text-transform:uppercase;
  text-shadow:
    0 0 4px #fff,
    0 0 10px var(--pk),
    0 0 20px var(--pk),
    0 0 36px var(--pi);
}
.main-title .deco{ color:var(--pk); margin:0 10px; }

/* ===== COLUMNA SURVIVOR ===== */
.survivor-col{ display:flex; flex-direction:column; align-items:center; }

.survivor-frame{ position:relative; width:118px; height:118px; flex-shrink:0; }

.survivor-card{
  position:absolute; inset:0; border-radius:18px;
  background:linear-gradient(135deg,var(--almost-black) 0%,var(--dark-purple) 100%);
  border:2px solid var(--pk); overflow:hidden; z-index:1;
  box-shadow:0 0 22px rgba(255,45,154,.5), 0 0 48px rgba(255,45,154,.22);
}

#survivorImg{
  height:100%; background-size:cover; background-position:center top; background-repeat:no-repeat;
  position:relative; transition:filter .12s;
  filter:brightness(1.18) saturate(1.12);   /* +BRILLO */
}
#survivorImg::after{
  content:''; position:absolute; bottom:0; left:0; right:0;
  height:40px; background:linear-gradient(to top,rgba(10,0,5,.55),transparent);
}
#survivorImg.rolling{ animation:sRoll .2s steps(2) infinite; }
@keyframes sRoll{ 0%{filter:brightness(1.18) saturate(1.12)} 50%{filter:brightness(1.45) saturate(1.12) hue-rotate(12deg)} }
#survivorImg.landed{ animation:sLand .65s ease-out forwards; }
@keyframes sLand{ 0%{filter:brightness(4) saturate(0)} 100%{filter:brightness(1.18) saturate(1.12)} }

/* ===== PERKS EN DIAMANTE EN FILA ===== */
.perks-col{ display:flex; flex-direction:column; align-items:center; }

.perks-row{
  display:flex;
  flex-direction:row;
  gap:40px;
  align-items:center;
  padding:12px 8px;
}

.perk-slot{
  width:80px; height:80px;
  transform:rotate(45deg);          /* DIAMANTE */
  border:2px solid var(--br);
  background:linear-gradient(135deg,var(--almost-black) 0%,var(--dark-purple) 100%);
  overflow:hidden;
  position:relative;
  box-shadow:0 0 14px rgba(255,45,154,.25);
  transition:border-color .35s, box-shadow .35s;
}
.perk-img{
  position:absolute;
  top:50%; left:50%;
  width:142%; height:142%;            /* cubre los picos del diamante */
  transform:translate(-50%,-50%) rotate(-45deg);  /* enderezar la imagen */
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/* Animación de bloqueo perk */
.perk-slot.perk-locked{ animation:pLock .7s ease-out forwards; }
@keyframes pLock{
  0%   { border-color:#fff; box-shadow:0 0 0 4px rgba(255,255,255,.8),0 0 30px #fff; }
  40%  { border-color:var(--pk); box-shadow:0 0 18px var(--pk),0 0 42px var(--pi); }
  100% { border-color:var(--pk); box-shadow:0 0 14px rgba(255,45,154,.4); }
}

/* ===== BOTÓN VOLVER A GIRAR ===== */
#spinBtn{
  font-family:'Bebas Neue', sans-serif;
  font-size:1.05rem; letter-spacing:.22em;
  color:#000; background:var(--pk); border:none;
  padding:10px 36px; border-radius:999px;
  cursor:pointer; position:relative; overflow:hidden;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 14px var(--pk),0 0 28px rgba(255,45,154,.5);
  text-transform:uppercase;
}
#spinBtn::before{
  content:''; position:absolute; top:0; left:-100%; width:100%; height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.22),transparent);
  transition:left .5s ease;
}
#spinBtn:hover:not(:disabled){ transform:translateY(-3px); box-shadow:0 0 30px var(--pk),0 0 60px rgba(255,45,154,.55); }
#spinBtn:hover:not(:disabled)::before{ left:100%; }
#spinBtn:disabled{ background:var(--br); color:rgba(255,255,255,.6); box-shadow:none; opacity:.6; cursor:not-allowed; }
#spinBtn.btn--spinning{ background:linear-gradient(135deg,var(--dg),var(--br)); color:#fff; }
@keyframes btnPulse{
  0%,100% { transform:scale(1); box-shadow:0 0 16px var(--pk),0 0 32px rgba(255,45,154,.5); }
  50%     { transform:scale(1.02); box-shadow:0 0 30px var(--pk),0 0 58px rgba(255,45,154,.7); }
}
#spinBtn:not(:disabled):not(:hover){ animation:btnPulse 2.4s ease-in-out infinite; }

/* ===== BURST ===== */
#burst{ position:fixed; top:50%; left:50%; width:0; height:0; z-index:50; pointer-events:none; }
.burst-particle{
  position:absolute; top:0; left:0; pointer-events:none;
  animation:bFly var(--dur,1s) ease-out var(--del,0s) forwards;
}
@keyframes bFly{
  0%   { transform:translate(-50%,-50%) scale(1) rotate(0deg); opacity:1; }
  100% { transform:translate(calc(-50% + var(--tx)),calc(-50% + var(--ty))) scale(var(--sf,.4)) rotate(var(--rot,180deg)); opacity:0; }
}

/* ===== LOADER ===== */
#loadWrap{ width:240px; height:3px; background:rgba(72,0,31,.45); border-radius:2px; overflow:hidden; display:none; margin-top:6px; }
#loadFill{ height:100%; width:0%; background:linear-gradient(90deg,var(--br),var(--pk)); box-shadow:0 0 6px var(--pk); transition:width .25s ease; }

/* ===== RESPONSIVE ===== */
@media(max-width:620px){
  .row{ gap:10px; }
  .survivor-frame{ width:100px; height:100px; }
  .perk-slot{ width:66px; height:66px; }
  .perks-row{ gap:32px; }
  .main-title{ font-size:1.2rem; letter-spacing:.18em; }
}
</style>
</head>
<body>

<div class="overlay">

  <div class="main-title"><span class="deco">✦</span>SURVI Y PERKS RANDOM<span class="deco">✦</span></div>

  <div class="row">

    <!-- ===== SURVIVOR ===== -->
    <div class="survivor-col">
      <div class="survivor-frame">
        <div class="survivor-card">
          <div id="survivorImg"></div>
        </div>
      </div>
    </div>

    <!-- ===== PERKS ===== -->
    <div class="perks-col">
      <div class="perks-row">
        <div class="perk-slot"><div class="perk-img" id="perk1"></div></div>
        <div class="perk-slot"><div class="perk-img" id="perk2"></div></div>
        <div class="perk-slot"><div class="perk-img" id="perk3"></div></div>
        <div class="perk-slot"><div class="perk-img" id="perk4"></div></div>
      </div>
    </div>

  </div>

  <button id="spinBtn" disabled>VOLVER A GIRAR</button>
  <div id="loadWrap"><div id="loadFill"></div></div>
</div>

<div id="burst"></div>

<script>

  'still-sight.png','streetwise.png','strength-in-shadows.png','superior-anatomy.png',
  'teamwork-collective-stealth.png','teamwork-full-circuit.png','teamwork-power-of-two.png','teamwork-soft-spoken.png',
  'teamwork-throw-down.png','teamwork-toughen-up.png','technician.png','tenacity.png',
  'this-is-not-happening.png','troubleshooter.png','unbreakable.png','up-the-ante.png',
  'urban-evasion.png','vigil.png','visionary.png','wake-up.png',
  'we-see-you.png','well-make-it.png','were-gonna-live-forever.png','wicked.png',
  'windows-of-opportunity.png','wiretap.png'
];

const perks = PERK_FILES.map(f => ({
  name: f.replace('.png','').replace(/-/g,' '),
  img : 'perks%20survis/' + f
}));

const survivors = [
  {name:'Ace Visconti',       img:'imagenes_survis/AceVisconti.png'},
  {name:'Adam Francis',       img:'imagenes_survis/AdamFrancis.png'},
  {name:'Ada Wong',           img:'imagenes_survis/AdaWong.png'},

  {name:'Bill Overbeck',      img:'imagenes_survis/BillOverbeck.png'},
  {name:'Cheryl Mason',       img:'imagenes_survis/CherylMason.png'},
  {name:'Claudette Morel',    img:'imagenes_survis/ClaudetteMorel.png'},
  {name:'David King',         img:'imagenes_survis/DavidKing.png'},
  {name:'David Tapp',         img:'imagenes_survis/DavidTapp.png'},
  {name:'Dustin Henderson',   img:'imagenes_survis/DustinHenderson.png'},
  {name:'Dwight Fairfield',   img:'imagenes_survis/DwightFairfield.png'},

  {name:'Haddie Kaur',        img:'imagenes_survis/HaddieKaur.png'},
  {name:'Jake Park',          img:'imagenes_survis/JakePark.png'},
  {name:'Jane Romero',        img:'imagenes_survis/JaneRomero.png'},
  {name:'Jeff Johansen',      img:'imagenes_survis/JeffJohansen.png'},

  {name:'The Troupe',         img:'imagenes_survis/TheTroupe.png'},
  {name:'Trevor Belmont',     img:'imagenes_survis/TrevorBelmont.png'},
  {name:'Vee Boonyasak',      img:'imagenes_survis/VeeBoonyasak.png'},
  {name:'Vittorio Toscano',   img:'imagenes_survis/VittorioToscano.png'},
  {name:'Yoichi Asakawa',     img:'imagenes_survis/YoichiAsakawa.png'},
  {name:'Yui Kimura',         img:'imagenes_survis/YuiKimura.png'},
  {name:'Zarina Kassir',      img:'imagenes_survis/ZarinaKassir.png'},
];

/* DOM refs */
const $ = id => document.getElementById(id);
const perkImgEls = [$('perk1'),$('perk2'),$('perk3'),$('perk4')];
const survivorImgEl = $('survivorImg');
const burstEl = $('burst');
const spinBtn = $('spinBtn');
const loadWrap = $('loadWrap');
const loadFill = $('loadFill');

/* Timing */
const PERK_STOPS   = [3000,4000,5000,6000];
const SURV_STOP    = 6600;
const SLOWDOWN_WIN = 1400;
const BASE_PERK_MS = 50;
const BASE_SURV_MS = 65;
const MAX_MS       = 320;

/* State */
const mkSlot = () => ({lastSwap:0, locked:false, final:null});
let state = {
  spinning:false, rafId:null, startTs:null,
  perkSlots:[mkSlot(),mkSlot(),mkSlot(),mkSlot()],
  survivorSlot:mkSlot(), lockedPerks:[],
};

/* Helpers */
const rand   = arr => arr[Math.floor(Math.random()*arr.length)];
const setImg = (el, src) => { el.style.backgroundImage = `url(${src})`; };

function cycleInterval(elapsed, stopTime, baseMs) {
  const rem = stopTime - elapsed;
  if (rem <= 0)           return Infinity;
  if (rem > SLOWDOWN_WIN) return baseMs;
  const t = 1 - rem / SLOWDOWN_WIN;
  return baseMs + (MAX_MS - baseMs) * t * t;
}

function lockPerk(i) {
  const used  = state.lockedPerks.map(p => p.img);
  const avail = perks.filter(p => !used.includes(p.img));
  const final = rand(avail);
  state.perkSlots[i].locked = true;
  state.perkSlots[i].final  = final;
  state.lockedPerks.push(final);
  setImg(perkImgEls[i], final.img);
  const slot = perkImgEls[i].closest('.perk-slot');
  slot.classList.add('perk-locked');
  setTimeout(() => slot.classList.remove('perk-locked'), 700);
}

function lockSurvivor() {
  const final = rand(survivors);
  state.survivorSlot.locked = true;
  state.survivorSlot.final  = final;
  setImg(survivorImgEl, final.img);
  survivorImgEl.classList.remove('rolling');
  survivorImgEl.classList.add('landed');
  setTimeout(() => survivorImgEl.classList.remove('landed'), 650);
}

function loop(ts) {
  if (!state.startTs) state.startTs = ts;
  const elapsed = ts - state.startTs;
  for (let i = 0; i < 4; i++) {
    const slot = state.perkSlots[i];
    if (slot.locked) continue;
    if (elapsed >= PERK_STOPS[i]) { lockPerk(i); continue; }
    const interval = cycleInterval(elapsed, PERK_STOPS[i], BASE_PERK_MS);
    if (ts - slot.lastSwap >= interval) { setImg(perkImgEls[i], rand(perks).img); slot.lastSwap = ts; }
  }
  const sSlot = state.survivorSlot;
  if (!sSlot.locked) {
    if (elapsed >= SURV_STOP) { lockSurvivor(); }
    else {
      const interval = cycleInterval(elapsed, SURV_STOP, BASE_SURV_MS);
      if (ts - sSlot.lastSwap >= interval) { setImg(survivorImgEl, rand(survivors).img); sSlot.lastSwap = ts; }
    }
  }
  const allDone = state.perkSlots.every(s => s.locked) && state.survivorSlot.locked;
  if (allDone) finishSpin();
  else state.rafId = requestAnimationFrame(loop);
}

function finishSpin() {
  launchBurst();
  state.spinning = false;
  spinBtn.disabled = false;
  spinBtn.classList.remove('btn--spinning');
  spinBtn.textContent = 'VOLVER A GIRAR';
}

function spin() {
  if (state.spinning) return;
  state.spinning = true;
  spinBtn.disabled = true;
  spinBtn.classList.add('btn--spinning');
  spinBtn.textContent = 'GIRANDO...';
  survivorImgEl.classList.remove('landed');
  survivorImgEl.classList.add('rolling');
  for (let i = 0; i < 4; i++) {
    perkImgEls[i].closest('.perk-slot').classList.remove('perk-locked');
  }
  state.startTs      = null;
  state.lockedPerks  = [];
  state.perkSlots    = [mkSlot(),mkSlot(),mkSlot(),mkSlot()];
  state.survivorSlot = mkSlot();
  if (state.rafId) cancelAnimationFrame(state.rafId);
  state.rafId = requestAnimationFrame(loop);
}

/* Burst */
const BURST_SYM  = ['♥','★','✦','✧','♡','✶'];
const BURST_COLS = ['#FF2D9A','#FF007F','#ffffff','#FFC1E1','#FF69B4','#D4006A'];
function launchBurst() {
  burstEl.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 80; i++) {
    const p = document.createElement('span');
    const angle = Math.random()*Math.PI*2;
    const dist  = 130+Math.random()*370;
    p.className = 'burst-particle';
    p.textContent = BURST_SYM[Math.floor(Math.random()*BURST_SYM.length)];
    p.style.cssText =
      `color:${BURST_COLS[Math.floor(Math.random()*BURST_COLS.length)]};`+
      `font-size:${10+Math.random()*20}px;`+
      `--tx:${Math.cos(angle)*dist}px;--ty:${Math.sin(angle)*dist}px;`+
      `--rot:${(Math.random()-.5)*720}deg;`+
      `--dur:${.85+Math.random()*.85}s;`+
      `--sf:${.3+Math.random()*.5};`+
      `--del:${Math.random()*.45}s;`;
    frag.appendChild(p);
  }
  burstEl.appendChild(frag);
  setTimeout(() => { burstEl.innerHTML=''; }, 2600);
}

/* Preload */
function preloadBatch(srcs, onProgress) {
  let done = 0;
  return Promise.allSettled(srcs.map(src => new Promise(resolve => {
    const img = new Image();
    img.onload = img.onerror = () => { onProgress(++done/srcs.length); resolve(); };
    img.src = src;
  })));
}

(async function init() {
  loadWrap.style.display = 'block';
  await preloadBatch(
    [PLACEHOLDER, ...survivors.map(s => s.img)],
    pct => { loadFill.style.width = (pct*65)+'%'; }
  );
  perkImgEls.forEach(el => setImg(el, PLACEHOLDER));
  setImg(survivorImgEl, PLACEHOLDER);
  spinBtn.disabled = false;
  spinBtn.textContent = 'VOLVER A GIRAR';
  spinBtn.addEventListener('click', spin, {passive:true});
  preloadBatch(
    perks.map(p => p.img),
    pct => { loadFill.style.width = (65+pct*35)+'%'; }
  ).then(() => {
    loadWrap.style.display = 'none';
    spin();  // primer giro automático al cargar
  });
}());
